server.address=${NEOCORE_BIND_ADDRESS:127.0.0.1}
server.port=${PORT:8443}

server.ssl.enabled=true
server.ssl.key-store=${TLS_KEYSTORE}
server.ssl.key-store-password=${TLS_KEYSTORE_PASSWORD}
server.ssl.key-store-type=PKCS12
server.ssl.enabled-protocols=TLSv1.3,TLSv1.2

neocore.seguranca.exigir-https=true
neocore.seguranca.exigir-lista-senhas=true

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:neocore}?sslmode=verify-full
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.hikari.data-source-properties.sslrootcert=${DB_CA_CERT}