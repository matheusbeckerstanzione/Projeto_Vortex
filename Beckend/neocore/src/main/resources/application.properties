# Segurança
neocore.seguranca.exigir-https=true
neocore.seguranca.exigir-lista-senhas=true

neocore.seguranca.senhas-bloqueadas=${NEOCORE_SENHAS_BLOQUEADAS:}
neocore.seguranca.cors-origins=${NEOCORE_CORS_ORIGINS:}

# Desativado por padrão
neocore.bootstrap.enabled=${NEOCORE_BOOTSTRAP_ENABLED:false}

# Spring Boot 4: usamos a autenticação própria do NeoCore.
# Evita a criação automática do usuário/senha padrão do Spring.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# Não confiar automaticamente em headers de proxy recebidos
server.forward-headers-strategy=none

# Respostas de erro
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# Persistência e logs
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO