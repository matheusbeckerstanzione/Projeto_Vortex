server.address=127.0.0.1

neocore.seguranca.exigir-https=false

# Exceção explícita para desenvolvimento local.
# Sem uma lista configurada, não há verificação de senhas vazadas.
neocore.seguranca.exigir-lista-senhas=false


spring.datasource.url=jdbc:postgresql://localhost:5432/neocore
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=false

