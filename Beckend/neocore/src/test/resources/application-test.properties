# Banco exclusivo dos testes
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/neocore_test
spring.datasource.username=${TEST_DB_USER:postgres}
spring.datasource.password=${TEST_DB_PASSWORD}

# Cria/atualiza as tabelas somente neste banco de testes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Esta primeira bateria verifica as entidades, não as migrations
spring.flyway.enabled=false

# Não executar o cadastro do administrador inicial
neocore.bootstrap.enabled=false

# Configurações locais de teste
neocore.seguranca.exigir-https=false
neocore.seguranca.exigir-lista-senhas=false

# Chave fixa exclusiva dos testes, sem relação com a chave real
NEOCORE_MFA_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=